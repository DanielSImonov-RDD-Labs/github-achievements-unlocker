name: Unlock GitHub Achievements

on:
  workflow_dispatch:
    inputs:
      pr_target:
        description: Total public merged pull requests to reach (tiers 2 / 16 / 128 / 1024)
        default: "16"
      coauthor:
        description: GitHub login that agreed to co-author (optional, for Pair Extraordinaire)
        required: false

permissions:
  contents: read

jobs:
  unlock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unlock achievements
        env:
          GH_TOKEN: ${{ secrets.ACHIEVEMENTS_TOKEN }}
          PR_TARGET: ${{ inputs.pr_target }}
          COAUTHOR: ${{ inputs.coauthor }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a personal access token as the ACHIEVEMENTS_TOKEN secret. The built-in GITHUB_TOKEN acts as github-actions[bot], so nothing is credited to you."
            exit 1
          fi
          bash unlock.sh run --repo "$GITHUB_REPOSITORY" --pr-target "$PR_TARGET" ${COAUTHOR:+--coauthor "$COAUTHOR"}
